<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lento Manickathan</title>
  </head>
  <style>
    * {
      background: #303446;
      font-family: monospace;
      font-weight: 500;
      color: #c6d0f5;
    }
    body {
      min-height: 95vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      font-size: 1rem;
    }
    @media (min-width: 600px) {
      body {
        font-size: 1.25rem;
      }
    }
  </style>
  <body>
    <div><span id="countdown"></span></div>
    <script>
      const el = document.getElementById("countdown");
      const target = new Date("2027-03-29T00:00:00");
      function tick() {
        let diff = target - new Date();
        if (diff <= 0) {
          el.textContent = "now";
          return;
        }
        el.textContent = `${Math.floor(diff / 1000)}`;
        setTimeout(tick, 1000);
      }
      tick();
    </script>
  </body>
</html>
