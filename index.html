<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lento Manickathan</title>
  </head>
  <style>
    * {
      background: #11111b;
      font-family: monospace;
      font-weight: 500;
      color: #cba6f7;
    }
    body {
      min-height: 95vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
    }
  </style>
  <body>
    <div><span id="countdown"></span></div>
    <script>
      const el = document.getElementById("countdown");
      const target = new Date("2027-03-29T00:00:00");
      function tick() {
        let diff = target - new Date();
        if (diff <= 0) {
          el.textContent = "now";
          return;
        }
        el.textContent = `${Math.floor(diff / 100)}`;
        setTimeout(tick, 100);
      }
      tick();
    </script>
  </body>
</html>
